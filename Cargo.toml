[workspace]
members = [".", "crates/calc", "crates/text", "integration-tests"]
resolver = "3"

[package]
name = "integration-tests-coverage"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
calc = { path = "crates/calc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
text = { path = "crates/text" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
